<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Brawl Stars Top 10</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>BRAWLER RANK</h1>
        <p>My Top 10 Brawlers</p>
    </header>

    <main>
        <section>
            <h2>TOP 10</h2>
            <div class="search-container">
                <label for="searchInput">Search Brawlers:</label>
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search for a brawler..."
                >
            </div>
            <label for="sortSelect">Sort by:</label>

<select id="sortSelect">
    <option value="rank">My Rank</option>
    <option value="overall">Overall</option>
    <option value="gameplay">Gameplay</option>
    <option value="fun">Fun</option>
    <option value="design">Design</option>
</select>
            <button id="toggleButton">Show Top 3</button>

            <div class="brawler-container" id="brawlerContainer">

            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
